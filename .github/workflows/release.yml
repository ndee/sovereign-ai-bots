name: Release Please

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main push CI run ID authorizing recovery/verification
        required: true
        type: string
      tag:
        description: Existing draft or published tag to recover/verify (defaults to package version)
        required: false
        type: string

permissions: {}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  ci_gate:
    name: Authorize successful main CI
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.name == 'CI' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      process: ${{ steps.gate.outputs.process }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          persist-credentials: false

      - name: Resolve exact CI-approved main SHA
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          CI_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RECOVERY_CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail
          set +e
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            APPROVED_SHA="$(bash scripts/check-release-ci-gate.sh \
              workflow-run "$CI_HEAD_SHA" "$CI_RUN_ID" "$CI_WORKFLOW_NAME" \
              "$CI_CONCLUSION" "$CI_EVENT" "$CI_HEAD_BRANCH" "$CI_HEAD_REPOSITORY")"
          else
            APPROVED_SHA="$(bash scripts/check-release-ci-gate.sh \
              workflow-dispatch "$RECOVERY_CI_RUN_ID")"
          fi
          GATE_STATUS=$?
          set -e
          if [[ "$GATE_STATUS" == "4" || "$GATE_STATUS" == "5" ]]; then
            echo "::notice::Release skipped because the CI gate did not authorize current main."
            echo 'process=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GATE_STATUS" != "0" ]]; then
            echo "::error::Release CI gate failed with status $GATE_STATUS."
            exit "$GATE_STATUS"
          fi
          printf 'process=true\nsha=%s\n' "$APPROVED_SHA" >> "$GITHUB_OUTPUT"

  release:
    name: Prepare and publish release
    needs: ci_gate
    if: needs.ci_gate.outputs.process == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.ci_gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Recovery may check out an older release commit. Keep the current
      # control-plane gate, lookup, and verifier available across that checkout.
      - name: Stage current release control tooling
        run: |
          install -d -m 0755 "$RUNNER_TEMP/release-control"
          install -m 0755 \
            scripts/find-github-release.sh \
            scripts/check-release-ci-gate.sh \
            scripts/verify-github-assets.sh \
            "$RUNNER_TEMP/release-control/"

      - name: Require release automation token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [[ -z "$RELEASE_PLEASE_TOKEN" ]]; then
            echo "::error::RELEASE_PLEASE_TOKEN is required so generated PRs trigger required CI."
            exit 1
          fi

      - name: Revalidate current main before release mutation
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          APPROVED_SHA: ${{ needs.ci_gate.outputs.sha }}
        run: bash scripts/check-release-ci-gate.sh revalidate "$APPROVED_SHA"

      - name: Open or advance the release PR
        id: release
        if: github.event_name == 'workflow_run'
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A failed build leaves a draft. A later successful main CI run may repair
      # that draft, while a CI-gated dispatch can recover or re-verify it.
      - name: Resolve release state and immutable tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          RECOVERY_TAG: ${{ inputs.tag }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          APPROVED_MAIN_SHA: ${{ needs.ci_gate.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_CREATED" == "true" ]]; then
            TAG="$RELEASE_TAG"
          elif [[ -n "$RECOVERY_TAG" ]]; then
            TAG="$RECOVERY_TAG"
          else
            VERSION="$(jq -r '.version' package.json)"
            TAG="v$VERSION"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag: $TAG"
            exit 1
          fi

          set +e
          RELEASE_JSON="$(
            bash "$RUNNER_TEMP/release-control/find-github-release.sh" "$TAG"
          )"
          LOOKUP_STATUS=$?
          set -e
          if [[ "$LOOKUP_STATUS" != "0" ]]; then
            if [[ "$LOOKUP_STATUS" == "4" && "$RELEASE_CREATED" != "true" && "$EVENT_NAME" == "workflow_run" ]]; then
              echo 'process=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Could not resolve exactly one GitHub Release for $TAG (status $LOOKUP_STATUS)."
            exit 1
          fi

          if ! jq -e --arg tag "$TAG" '
            type == "object" and
            (.id | (type == "number") and (floor == .) and (. > 0)) and
            (.tag_name | (type == "string") and (. == $tag)) and
            (.target_commitish | (type == "string") and test("^[0-9a-f]{40}$")) and
            (.draft | type == "boolean")
          ' <<<"$RELEASE_JSON" >/dev/null; then
            echo "::error::Release $TAG has invalid GitHub metadata."
            exit 1
          fi

          RELEASE_ID="$(jq -r '.id' <<<"$RELEASE_JSON")"
          TARGET_COMMITISH="$(jq -r '.target_commitish' <<<"$RELEASE_JSON")"
          IS_DRAFT="$(jq -r '.draft' <<<"$RELEASE_JSON")"
          if [[ "$RELEASE_CREATED" == "true" && "$IS_DRAFT" != "true" ]]; then
            echo "::error::Release Please did not create $TAG as a draft."
            exit 1
          fi
          if [[ "$EVENT_NAME" == "workflow_run" && "$RELEASE_CREATED" != "true" && "$IS_DRAFT" != "true" ]]; then
            echo 'process=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin main --tags --force
          TAG_SHA="$(git rev-list -n 1 "$TAG")"
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "::error::Release tag $TAG ($TAG_SHA) is not an ancestor of main."
            exit 1
          fi
          if [[ "$RELEASE_CREATED" == "true" && "$TAG_SHA" != "$RELEASE_SHA" ]]; then
            echo "::error::Release Please reported $RELEASE_SHA but $TAG resolves to $TAG_SHA."
            exit 1
          fi
          if [[ "$RELEASE_CREATED" == "true" && "$RELEASE_SHA" != "$APPROVED_MAIN_SHA" ]]; then
            echo "::error::Release Please created $TAG at $RELEASE_SHA, but CI approved $APPROVED_MAIN_SHA."
            exit 1
          fi
          if [[ "$TARGET_COMMITISH" != "$TAG_SHA" ]]; then
            echo "::error::Release $TAG targets $TARGET_COMMITISH, expected $TAG_SHA."
            exit 1
          fi
          printf 'process=true\ndraft=%s\ntag=%s\nsha=%s\nrelease_id=%s\n' \
            "$IS_DRAFT" "$TAG" "$TAG_SHA" "$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Check out the release commit
        if: steps.resolve.outputs.process == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        if: steps.resolve.outputs.process == 'true' && steps.resolve.outputs.draft == 'true'
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        if: steps.resolve.outputs.process == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ steps.resolve.outputs.draft == 'true' && 'pnpm' || '' }}

      - name: Frozen dependency install
        if: steps.resolve.outputs.process == 'true' && steps.resolve.outputs.draft == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build and verify exact release assets
        if: steps.resolve.outputs.process == 'true' && steps.resolve.outputs.draft == 'true'
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          RELEASE_SHA: ${{ steps.resolve.outputs.sha }}
          SOURCE_COMMIT: ${{ steps.resolve.outputs.sha }}
          SOVEREIGN_RELEASE_ID: ${{ steps.resolve.outputs.tag }}
        run: |
          pnpm build
          pnpm release:artifact -- \
            --output-dir release-assets \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_SHA"

      - name: Download published assets for recovery verification
        if: steps.resolve.outputs.process == 'true' && steps.resolve.outputs.draft != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          TARBALL="sovereign-ai-bots-${VERSION}.tgz"
          install -d -m 0755 release-assets
          gh release download "$RELEASE_TAG" \
            --dir release-assets \
            --pattern component-release.json \
            --pattern "$TARBALL"
          mapfile -t DOWNLOADED < <(
            find release-assets -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort
          )
          EXPECTED=("component-release.json" "$TARBALL")
          if [[ "${DOWNLOADED[*]}" != "${EXPECTED[*]}" ]]; then
            printf 'unexpected downloaded release assets: %s\n' "${DOWNLOADED[*]}" >&2
            exit 1
          fi

      - name: Verify downloaded published artifact
        if: steps.resolve.outputs.process == 'true' && steps.resolve.outputs.draft != 'true'
        env:
          RELEASE_VERSION: ${{ steps.resolve.outputs.tag }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          node scripts/release-artifact.mjs verify \
            --artifact "release-assets/sovereign-ai-bots-${VERSION}.tgz" \
            --manifest release-assets/component-release.json

      - name: Require immutable releases
        if: steps.resolve.outputs.process == 'true' && steps.resolve.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/immutable-releases" \
            --jq 'select(.enabled == true) | .enabled' |
            grep -qx true

      - name: Revalidate current main before draft asset upload
        id: asset_gate
        if: steps.resolve.outputs.process == 'true' && steps.resolve.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          APPROVED_SHA: ${{ needs.ci_gate.outputs.sha }}
        run: |
          set -euo pipefail
          set +e
          bash "$RUNNER_TEMP/release-control/check-release-ci-gate.sh" \
            revalidate "$APPROVED_SHA"
          GATE_STATUS=$?
          set -e
          if [[ "$GATE_STATUS" == "5" ]]; then
            echo "::notice::Draft assets remain unchanged because main advanced after CI approval."
            echo 'upload=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GATE_STATUS" != "0" ]]; then
            echo "::error::Pre-upload CI gate failed with status $GATE_STATUS."
            exit "$GATE_STATUS"
          fi
          echo 'upload=true' >> "$GITHUB_OUTPUT"

      - name: Attach all assets to the draft
        if: >-
          steps.resolve.outputs.process == 'true' &&
          steps.resolve.outputs.draft == 'true' &&
          steps.asset_gate.outputs.upload == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          TARBALL="release-assets/sovereign-ai-bots-${RELEASE_TAG#v}.tgz"
          gh release upload "$RELEASE_TAG" \
            release-assets/component-release.json \
            "$TARBALL" \
            --clobber

      - name: Verify complete draft on GitHub
        if: >-
          steps.resolve.outputs.process == 'true' &&
          steps.resolve.outputs.draft == 'true' &&
          steps.asset_gate.outputs.upload == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          RELEASE_SHA: ${{ steps.resolve.outputs.sha }}
          RELEASE_ID: ${{ steps.resolve.outputs.release_id }}
        run: |
          TARBALL="release-assets/sovereign-ai-bots-${RELEASE_TAG#v}.tgz"
          bash "$RUNNER_TEMP/release-control/verify-github-assets.sh" \
            draft "$RELEASE_TAG" "$RELEASE_SHA" "$RELEASE_ID" \
            release-assets/component-release.json \
            "$TARBALL"

      - name: Revalidate current main immediately before publication
        id: publish_gate
        if: >-
          steps.resolve.outputs.process == 'true' &&
          steps.resolve.outputs.draft == 'true' &&
          steps.asset_gate.outputs.upload == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          APPROVED_SHA: ${{ needs.ci_gate.outputs.sha }}
        run: |
          set -euo pipefail
          set +e
          bash "$RUNNER_TEMP/release-control/check-release-ci-gate.sh" \
            revalidate "$APPROVED_SHA"
          GATE_STATUS=$?
          set -e
          if [[ "$GATE_STATUS" == "5" ]]; then
            echo "::notice::Release remains a draft because main advanced after CI approval."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GATE_STATUS" != "0" ]]; then
            echo "::error::Pre-publication CI gate failed with status $GATE_STATUS."
            exit "$GATE_STATUS"
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"

      - name: Publish the immutable release
        if: >-
          steps.resolve.outputs.process == 'true' &&
          steps.resolve.outputs.draft == 'true' &&
          steps.publish_gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi

      - name: Verify published release metadata and assets
        if: >-
          steps.resolve.outputs.process == 'true' &&
          (steps.resolve.outputs.draft != 'true' ||
           steps.publish_gate.outputs.publish == 'true')
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          RELEASE_SHA: ${{ steps.resolve.outputs.sha }}
          RELEASE_ID: ${{ steps.resolve.outputs.release_id }}
        run: |
          TARBALL="release-assets/sovereign-ai-bots-${RELEASE_TAG#v}.tgz"
          bash "$RUNNER_TEMP/release-control/verify-github-assets.sh" \
            published "$RELEASE_TAG" "$RELEASE_SHA" "$RELEASE_ID" \
            release-assets/component-release.json \
            "$TARBALL"

      - name: Verify release attestation and assets
        if: >-
          steps.resolve.outputs.process == 'true' &&
          (steps.resolve.outputs.draft != 'true' ||
           steps.publish_gate.outputs.publish == 'true')
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          TARBALL="release-assets/sovereign-ai-bots-${RELEASE_TAG#v}.tgz"
          for attempt in $(seq 1 12); do
            if gh release verify "$RELEASE_TAG"; then
              break
            fi
            if [[ "$attempt" == "12" ]]; then
              echo "::error::Immutable release attestation was not available."
              exit 1
            fi
            sleep 5
          done
          gh release verify-asset "$RELEASE_TAG" release-assets/component-release.json
          gh release verify-asset "$RELEASE_TAG" "$TARBALL"
